services:
  - type: web
    name: stayscape
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix server --include=dev && npm install --prefix client --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: "*"
